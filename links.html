    <!-- Custom CSS & Neon Theme Variables -->
    <style>
        :root {
            --bg-primary: #050505;
            --accent-neon: #00BFFF;
            --accent-green: #00FF66;
            --card-bg: #0d0d12;
            --card-border: rgba(0, 191, 255, 0.2);
            --text-secondary: #00BFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            overflow-x: hidden;
        }

        /* Subtle neon glow effects */
        .neon-glow {
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
        }

        .neon-green-glow {
            color: var(--accent-green);
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        .neon-box-glow {
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.15);
        }

        .neon-box-glow:hover {
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.5), inset 0 0 15px rgba(0, 191, 255, 0.2);
        }

        /* Smooth button transition and hover transformations */
        .link-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background-color: var(--accent-neon);
            border-color: var(--accent-neon);
            color: #050505 !important;
            transform: translateY(-3px);
        }

        .link-card:hover .icon-container,
        .link-card:hover .arrow-icon {
            color: #050505 !important;
            transform: scale(1.1);
        }

        .link-card:hover span {
            color: #050505 !important;
        }

        /* Entrance animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-down {
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .animate-fade-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a24;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00BFFF;
        }
    </style>
